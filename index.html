<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32"><title>Kisan Daily AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3eb;color:#172116;font-family:system-ui,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding-bottom:30px}
header{height:72px;padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid #e4e9e1}header b{font-size:21px;display:block}header small{color:#687264}
main{padding:14px 16px}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#276b2b,#69a83f);color:#fff}.hero h1{margin:8px 0;font-size:24px}.hero p{margin:0;line-height:1.5}
.card{background:#fff;border:1px solid #e0e7dc;border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #00000009}
select,input{width:100%;padding:12px;border:1px solid #d7dfd3;border-radius:12px;margin:7px 0;font-size:15px}.primary{width:100%;border:0;background:#2e7d32;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.preview{width:100%;max-height:300px;object-fit:cover;border-radius:15px;margin-top:10px;display:none}.result{background:#f7faf5;border-left:4px solid #4b8d3d;padding:14px;border-radius:12px;margin-top:12px;white-space:pre-wrap;line-height:1.55}.muted{color:#687264;font-size:13px}.tag{display:inline-block;padding:5px 9px;background:#edf6e9;border-radius:12px;font-size:12px;color:#2e7d32}
</style></head><body><div class="app"><header><div><b>🌾 Kisan Daily</b><small>AI फसल सहायता</small></div></header>
<main><section class="hero"><span class="tag">AI Vision</span><h1>फसल की फोटो से शुरुआती जांच</h1><p>साफ फोटो अपलोड करें और संभावित समस्या व शुरुआती सलाह पाएं।</p></section>
<div class="card"><select id="crop"><option value="">फसल चुनें</option><option>धान</option><option>मक्का</option><option>गेहूं</option><option>सरसों</option><option>सब्जियां</option></select>
<input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview">
<button class="primary" id="analyze">🤖 AI से जांच करें</button><div id="status" class="muted" style="margin-top:10px"></div><div id="result"></div></div>
<div class="card"><b>⚠️ जरूरी सावधानी</b><p class="muted">AI result संभावित पहचान है, अंतिम कृषि निदान नहीं। गंभीर समस्या में स्थानीय कृषि विशेषज्ञ से पुष्टि करें। बिना पुष्टि के pesticide dose न अपनाएं।</p></div>
</main></div>
<script>
const photo=document.getElementById("photo"),preview=document.getElementById("preview"),status=document.getElementById("status"),result=document.getElementById("result");
photo.onchange=()=>{const f=photo.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display="block"};
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",.82))};img.onerror=reject;img.src=url})}
document.getElementById("analyze").onclick=async()=>{const crop=document.getElementById("crop").value,file=photo.files[0];result.innerHTML="";if(!crop||!file){result.innerHTML='<div class="result">पहले फसल और फोटो चुनें।</div>';return}
status.textContent="🔄 फोटो तैयार हो रही है…";try{const image=await compressImage(file);status.textContent="🤖 AI फोटो का विश्लेषण कर रहा है…";const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({crop,image})});const d=await r.json();if(!r.ok)throw Error(d.error||"AI request failed");result.innerHTML='<div class="result"><b>🌱 AI परिणाम</b>\n\n'+esc(d.result)+'</div>';status.textContent="✅ Analysis complete"}catch(e){status.textContent="";result.innerHTML='<div class="result">❌ '+esc(e.message)+'</div>'}};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
